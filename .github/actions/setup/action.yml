name: Install Front Awesome test dependencies
description: Install Composer before npm and reuse downloaded archives
inputs:
  composer-mode:
    description: Install from the lockfile or resolve with prefer-lowest or prefer-stable
    default: install
  frontend:
    description: Install the npm dependencies
    default: 'true'
  coverage:
    description: PHP coverage driver
    default: none
runs:
  using: composite
  steps:
    - name: Set up CI dependencies
      uses: artisan-toolbox/maintainer@498f5f8723cbed3d24af0ba90870ca26010db4df # 1.14.2
      with:
        php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
        php-coverage: ${{ inputs.coverage }}
        composer-mode: ${{ inputs.composer-mode }}
        composer-scripts: 'false'

    - name: Discover Testbench packages
      shell: bash
      run: composer run prepare

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.frontend == 'true'
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install npm dependencies
      if: inputs.frontend == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
