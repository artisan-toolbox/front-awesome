name: Install Front Awesome test dependencies
description: Install Composer before npm and reuse downloaded archives
inputs:
  composer-mode:
    description: Composer install or update mode
    default: locked
  frontend:
    description: Install the npm dependencies
    default: 'true'
  coverage:
    description: PHP coverage driver
    default: none
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.5'
        extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
        ini-values: error_reporting=E_ALL, display_errors=stderr
        tools: composer:v2
        coverage: ${{ inputs.coverage }}

    - name: Locate Composer download cache
      id: composer
      shell: bash
      run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer package downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer.outputs.path }}
        key: composer-${{ runner.os }}-${{ inputs.composer-mode }}-${{ hashFiles('composer.lock', 'composer.json') }}
        restore-keys: composer-${{ runner.os }}-${{ inputs.composer-mode }}-

    - name: Install PHP dependencies
      shell: bash
      env:
        COMPOSER_MODE: ${{ inputs.composer-mode }}
      run: |
        case "$COMPOSER_MODE" in
          locked) composer install --prefer-dist --no-interaction --no-progress --no-scripts ;;
          lowest) composer update --prefer-lowest --prefer-dist --no-interaction --no-progress --no-scripts ;;
          latest) composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts ;;
          *) echo "Unknown Composer mode $COMPOSER_MODE" >&2; exit 1 ;;
        esac
        composer run prepare

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.frontend == 'true' && 'npm' || '' }}

    - name: Install npm dependencies
      if: inputs.frontend == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
