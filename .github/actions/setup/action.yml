name: Install Front Awesome test dependencies
description: Install Composer before npm and reuse downloaded archives
inputs:
  composer-mode:
    description: Install from the lockfile or resolve with prefer-lowest or prefer-stable
    default: install
  composer-validation:
    description: Composer manifest validation mode passed to Maintainer
    default: none
  npm-install:
    description: Install the npm dependencies in addition to the Node.js runtime
    default: 'true'
  coverage:
    description: PHP coverage driver
    default: none
runs:
  using: composite
  steps:
    - name: Read the Node.js version
      id: node
      shell: bash
      run: |
        version=$(tr -d '\r\n' < .nvmrc)
        if [[ -z "$version" ]]; then
          echo '::error::.nvmrc must specify a Node.js version.'
          exit 1
        fi
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Set up CI dependencies
      uses: artisan-toolbox/maintainer@f3ace73a7020f1a76a62fa3c9137b1b541bb8cc8 # 1.14.3
      env:
        NPM_CONFIG_AUDIT: 'false'
        NPM_CONFIG_FUND: 'false'
      with:
        php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
        php-coverage: ${{ inputs.coverage }}
        composer-mode: ${{ inputs.composer-mode }}
        composer-validation: ${{ inputs.composer-validation }}
        node-version: ${{ steps.node.outputs.version }}
        npm-install: ${{ inputs.npm-install }}
        npm-cache: ${{ inputs.npm-install }}
