name: tests

on:
  push:
    branches: ['*.x']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      compatibility: ${{ steps.plan.outputs.compatibility }}
      browsers: ${{ steps.plan.outputs.browsers }}
      full-browsers: ${{ steps.plan.outputs.fullBrowsers }}
      coverage: ${{ steps.plan.outputs.coverage }}
      playwright: ${{ steps.plan.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test scripts/ci-plan.test.mjs
      - id: plan
        run: node scripts/ci-plan.mjs

  linux:
    name: Linux quality and build${{ matrix.php == '8.6' && ' / PHP 8.6' || '' }}
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
          composer-validation: strict
      - run: composer ci:check

  windows:
    name: Windows runtime${{ matrix.php == '8.6' && ' / PHP 8.6' || '' }}
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
      - run: composer quality:check -- --tool=pest --tool=vite-plus-test
        env:
          MAINTAINER_PEST_PARALLEL: 'false'
      - run: node scripts/check-data-view-types.mjs

  compatibility:
    name: PHP compatibility (${{ matrix.dependencies }})${{ matrix.php == '8.6' && ' / PHP 8.6' || '' }}
    needs: plan
    if: needs.plan.outputs.compatibility == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        dependencies: [lowest, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
          composer-mode: ${{ matrix.dependencies == 'lowest' && 'prefer-lowest' || 'prefer-stable' }}
          npm-install: 'false'
      - run: composer quality:check -- --tool=pest
      - run: composer test:types

  browsers:
    name: Browser integration
    needs: plan
    if: needs.plan.outputs.browsers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.plan.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the browser container home
        shell: bash
        run: |
          home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          if [[ ! -d "$home" || ! -O "$home" ]]; then
            echo "::error::The browser container user must own its home directory."
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
          printf 'BROWSER_CONTAINER_HOME=%s\n' "$home" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          coverage: ${{ needs.plan.outputs.coverage == 'true' && 'xdebug' || 'none' }}
      - if: needs.plan.outputs.full-browsers == 'true'
        run: HOME="$BROWSER_CONTAINER_HOME" npm run test:theme
      - if: needs.plan.outputs.full-browsers == 'true'
        run: HOME="$BROWSER_CONTAINER_HOME" npm run test:scrollbar
      - if: needs.plan.outputs.coverage != 'true'
        run: HOME="$BROWSER_CONTAINER_HOME" npm run test:browser
      - name: Report runtime test coverage
        if: needs.plan.outputs.coverage == 'true'
        env:
          COMPOSER_ALLOW_XDEBUG: '1'
          XDEBUG_MODE: coverage
        run: |
          composer test:coverage -- --coverage-html build/coverage/php
          HOME="$BROWSER_CONTAINER_HOME" npm run test:coverage
      - name: Upload coverage reports
        if: needs.plan.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: build/coverage/
          if-no-files-found: error

  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [plan, linux, windows, compatibility, browsers]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          CHECKS_REQUIRED: ${{ needs.plan.outputs.checks }}
          COMPATIBILITY_REQUIRED: ${{ needs.plan.outputs.compatibility }}
          BROWSERS_REQUIRED: ${{ needs.plan.outputs.browsers }}
        run: |
          set -eu
          test "$PLAN_RESULT" = success
          verify() {
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) echo "::error::$1 was $3 (required: $2)"; return 1 ;;
            esac
          }
          verify Linux "$CHECKS_REQUIRED" "$LINUX_RESULT"
          verify Windows "$CHECKS_REQUIRED" "$WINDOWS_RESULT"
          verify Compatibility "$COMPATIBILITY_REQUIRED" "$COMPATIBILITY_RESULT"
          verify Browsers "$BROWSERS_REQUIRED" "$BROWSERS_RESULT"
