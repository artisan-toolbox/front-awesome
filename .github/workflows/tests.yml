name: tests

on:
  push:
    branches:
      - 1.x
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run configured quality checks
        run: php vendor/bin/maintainer quality:check --no-interaction

      - name: Verify PHP type coverage
        run: composer test:types

      - name: Install Chromium for browser coverage
        if: matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable'
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify shared theme production consumers
        if: matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable'
        run: npm run test:theme

      - name: Report runtime test coverage
        if: matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable'
        env:
          COMPOSER_ALLOW_XDEBUG: '1'
          XDEBUG_MODE: coverage
        run: |
          composer test:coverage -- --coverage-html build/coverage/php
          npm run test:coverage

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/coverage/
          if-no-files-found: error

      - name: Build the Vite consumer fixture
        run: npm run build
